name: Update Fear and Greed Index

on:
  schedule:
    # 매 시간 정각 실행 (UTC 기준 24시간 매시간 실행)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cloudscraper pytz

    - name: Run Scraper
      run: python fg_scraper.py

    - name: Commit and Push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add fg_data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update F&G index" && git push)
